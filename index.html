    mb.limb(W(hip), W(knee), legW * s, legW * s, WD(left), o.pants, MAT_CLOTH);
    mb.limb(W(knee), W(end), (legW - 0.02) * s, (legW - 0.02) * s, WD(left), o.pants, MAT_CLOTH);
    const fy = k === 0 ? p.footYawL : p.footYawR;
    const fdir = v3(-Math.cos(fy), 0, Math.sin(fy));
    const fside = cross(v3(0, 1, 0), fdir);
    const fc = add(sub(end, v3(0, 0.04 * s, 0)), mul(fdir, 0.07 * s));
    mb.box(mBasis(WD(fside), WD(v3(0, 1, 0)), WD(fdir), W(fc)), v3(0.065 * s, 0.05 * s, 0.155 * s), o.shoes, MAT_CLOTH);
  }
  // hips + torso
  mb.box(mBasis(WD(left), WD(v3(0, 1, 0)), WD(xDir(Rp, v3(-1, 0, 0))), W(pel)), v3(0.19 * s, 0.1 * s, 0.13 * s), o.pants, MAT_CLOTH);
  const chestC = add(pel, mul(tUp, 0.3 * s));
  mb.box(mBasis(WD(tLeft), WD(tUp), WD(tFwd), W(chestC)), v3(0.2 * s, 0.26 * s, 0.125 * s), o.shirt, MAT_CLOTH);
  const neck = add(pel, mul(tUp, 0.56 * s));
  // head
  const Rh = mulM(mulM(Rt, mRotY(p.headYaw)), mRotZ(p.headPitch));
  const hUp = xDir(Rh, v3(0, 1, 0)), hLeft = xDir(Rh, v3(0, 0, 1)), hFwd = xDir(Rh, v3(-1, 0, 0));
  const headC = add(neck, mul(hUp, 0.14 * s));
  mb.limb(W(sub(neck, mul(tUp, 0.02))), W(add(neck, mul(hUp, 0.06 * s))), 0.08 * s, 0.08 * s, WD(tLeft), o.skin, MAT_SKIN);
  const HB = mBasis(WD(hLeft), WD(hUp), WD(hFwd), W(headC));
  mb.box(HB, v3(0.1 * s, 0.12 * s, 0.11 * s), o.skin, MAT_SKIN);
  mb.box(mulM(HB, mTranslate(v3(0.035 * s, 0.025 * s, 0.112 * s))), v3(0.018 * s, 0.012 * s, 0.004 * s), hexc(0x151515), MAT_PLAIN);
  mb.box(mulM(HB, mTranslate(v3(-0.035 * s, 0.025 * s, 0.112 * s))), v3(0.018 * s, 0.012 * s, 0.004 * s), hexc(0x151515), MAT_PLAIN);
  if (o.hat_ === 0) {
    mb.box(mulM(HB, mTranslate(v3(0, 0.1 * s, -0.01 * s))), v3(0.105 * s, 0.035 * s, 0.115 * s), o.hair, MAT_CLOTH);
  } else if (o.hat_ === 3) {
    mb.box(mulM(HB, mTranslate(v3(0, 0.1 * s, -0.005 * s))), v3(0.11 * s, 0.06 * s, 0.12 * s), o.hat, MAT_CLOTH);
  } else {
    mb.box(mulM(HB, mTranslate(v3(0, 0.105 * s, 0))), v3(0.108 * s, 0.04 * s, 0.118 * s), o.hat, MAT_CLOTH);
    const bz = o.hat_ === 1 ? 0.16 : -0.16;
    mb.box(mulM(HB, mTranslate(v3(0, 0.08 * s, bz * s))), v3(0.085 * s, 0.01 * s, 0.07 * s), o.hat, MAT_CLOTH);
  }
  // arms
  for (let k = 0; k < 2; k++) {
    const sg = k === 0 ? 1 : -1;
    const sh = add(sub(neck, mul(tUp, 0.06 * s)), mul(tLeft, 0.22 * sg * s));
    const hand = mul(k === 0 ? p.handL : p.handR, s);
    const hint = k === 0 ? p.elbowHintL : p.elbowHintR;
    const end = v3();
    const elbow = ikJoint(sh, hand, 0.29 * s, 0.27 * s, hint, end);
    mb.limb(W(sh), W(elbow), 0.12 * s, 0.12 * s, WD(tFwd), o.shirt, MAT_CLOTH);
    mb.limb(W(elbow), W(end), 0.085 * s, 0.085 * s, WD(tFwd), o.longSleeves ? o.shirt : o.skin, o.longSleeves ? MAT_CLOTH : MAT_SKIN);
    const hd = norm(sub(end, elbow));
    mb.limb(W(end), W(add(end, mul(hd, 0.09 * s))), 0.08 * s, 0.05 * s, WD(tFwd), o.skin, MAT_SKIN);
  }
  if (o.bag) {
    const bc = add(add(sub(pel, v3(0, 0.1 * s, 0)), mul(left, -0.26 * s)), v3(0, 0, 0));
    mb.box(mBasis(WD(left), WD(v3(0, 1, 0)), WD(xDir(Rp, v3(-1, 0, 0))), W(bc)), v3(0.05 * s, 0.16 * s, 0.2 * s), o.bagCol, MAT_CLOTH);
  }
}

// Skateboard in board space: deck top centre at origin, nose +Z
function drawBoard(mb, B) {
  const grip = hexc(0x222222), deck = hexc(0xd8402a), truck = hexc(0xb8bcc0), wheel = hexc(0xf0ead8);
  mb.box(mulM(B, mTranslate(v3(0, -0.009, 0))), v3(0.105, 0.009, 0.3), deck, MAT_PAINTED, ALL_FACES, grip);
  for (let sg = -1; sg <= 1; sg += 2) {
    const K = mulM(mulM(mulM(B, mTranslate(v3(0, -0.009, sg * 0.3))), mRotX(-sg * 0.33)), mTranslate(v3(0, 0, sg * 0.075)));
    mb.box(K, v3(0.1, 0.009, 0.078), deck, MAT_PAINTED, ALL_FACES, grip);
    mb.box(mulM(B, mTranslate(v3(0, -0.04, sg * 0.22))), v3(0.02, 0.022, 0.035), truck, MAT_METAL);
    mb.box(mulM(B, mTranslate(v3(0, -0.062, sg * 0.22))), v3(0.085, 0.012, 0.014), truck, MAT_METAL);
    for (let sx = -1; sx <= 1; sx += 2)
      mb.cylinder(mulM(mulM(B, mTranslate(v3(sx * 0.07, -0.07, sg * 0.22))), mRotZ(Math.PI / 2)), 0.028, 0.032, 8, wheel, MAT_PLAIN, true);
  }
  // stripe on the bottom
  mb.box(mulM(B, mTranslate(v3(0, -0.0185, 0))), v3(0.02, 0.0005, 0.26), hexc(0xf0e8d0), MAT_PLAIN, 8);
}

// Build the skater's pose + board transform for the current state and draw them.
function drawSkater(mb, pl, ctrl) {
  if (pl.state === ST_BAIL) {
    // tumbling body + loose board
    const up = v3(0, 1, 0), side = cross(up, fwdYaw(pl.yaw));
    const base = mBasis(side, up, fwdYaw(pl.yaw), add(pl.bodyPos, v3(0, 0.05, 0)));
    const ang = pl.bodyAng * (Math.PI * 0.47);
    const M = mulM(mulM(base, mRotZ(ang)), mTranslate(v3(0, -0.2 * pl.bodyAng, 0)));
    const p = newPose();
    p.pelvis = v3(0.1, 0.75, 0);
    p.lean = -0.2;
    p.handL = v3(-0.1, 1.1, 0.7); p.handR = v3(0.1, 1.05, -0.7);
    p.footL = v3(-0.1, 0.1, 0.35); p.footR = v3(0.2, 0.25, -0.35);
    p.headYaw = 0.2; p.headPitch = 0.3;
    drawHuman(mb, M, p, PLAYER_OUTFIT);
    drawBoard(mb, mulM(mulM(mTranslate(add(pl.boardPos, v3(0, 0.08, 0))), mRotY(pl.yaw + pl.boardAng * 0.5)), mRotZ(pl.boardAng)));
    return;
  }
  const up = norm(pl.upVis);
  const f = fwdYaw(pl.yaw);
  let fwd = sub(f, mul(up, dot(f, up)));
  if (len(fwd) < 1e-3) fwd = v3(0, 0, 1);
  fwd = norm(fwd);
  const side = cross(up, fwd);
  let lift = 0.1;
  if (pl.state === ST_GRIND) lift = GRINDS[pl.grindIdx].slide ? 0.03 : 0.08;
  const R = mBasis(side, up, fwd, add(pl.pos, mul(up, lift)));   // rider space == board space
  const p = newPose();
  const speed = len(pl.vel);
  const fakie = pl.isFakie();
  p.headYaw = fakie ? -0.9 : 0.75;
  const steer = (ctrl.left ? 1 : 0) - (ctrl.right ? 1 : 0);
  const squash = pl.landSquash;
  let boardT = new M4();   // trick transform applied to the board in rider space
  let boardOff = v3(0, 0, 0);
  if (pl.state === ST_RIDE || pl.state === ST_MANUAL) {
    const crouch = pl.crouching ? smooth01(pl.crouchT / 0.3) : 0;
    p.pelvis.y = 0.86 - crouch * 0.26 - squash * 0.2 - (pl.braking ? 0.08 : 0);
    p.lean = 0.15 + crouch * 0.25 - steer * 0.22 * sat(speed / 6);
    p.side = 0;
    if (crouch > 0) { p.handL = v3(-0.25, 0.45, 0.32); p.handR = v3(-0.2, 0.42, -0.3); }
    if (pl.braking) {   // heel drag / powerslide stance
      p.footR = v3(0.05, 0.0, -0.28);
      p.lean = -0.05;
      boardT = mRotY(0.25);
    }
    if (pl.pushing || pl.pushPhase > 0) {
      const ph = pl.pushPhase % 1;
      const gy = -0.1;
      const onBoard = v3(0.02, 0, -0.25);
      const plant = v3(-0.16, gy, 0.12), pushEnd = v3(-0.16, gy, -0.6);
      let fp;
      if (ph < 0.25) fp = add(lerp3(onBoard, plant, smooth01(ph / 0.25)), v3(0, Math.sin((ph / 0.25) * Math.PI) * 0.08, 0));
      else if (ph < 0.65) fp = lerp3(plant, pushEnd, (ph - 0.25) / 0.4);
      else fp = add(lerp3(pushEnd, onBoard, smooth01((ph - 0.65) / 0.35)), v3(0, Math.sin(((ph - 0.65) / 0.35) * Math.PI) * 0.12, 0));
      p.footR = fp;
      p.footYawL = 1.35;
      p.footYawR = 1.2;
      p.twist = 1.1;
      p.headYaw = 0.35;
      p.pelvis = v3(0.0, 0.8, 0.1);
      p.lean = 0.3;
      p.handL = v3(-0.1, 0.62, 0.5);
      p.handR = v3(0.15, 0.62, -0.3);
    }
    if (pl.state === ST_MANUAL) {
      const a = pl.nose ? 0.2 : -0.2;
      const pivot = pl.nose ? 0.22 : -0.22;
      boardT = mulM(mulM(mTranslate(v3(0, 0, pivot)), mRotX(a)), mTranslate(v3(0, 0, -pivot)));
      if (!pl.nose) { p.footL = v3(0, 0.09, 0.24); p.footR = v3(0.02, 0.0, -0.24); }
      else { p.footL = v3(0, 0.0, 0.24); p.footR = v3(0.02, 0.09, -0.24); }
      p.pelvis = v3(0.04, 0.8, pl.nose ? 0.1 : -0.1);
      p.side = (pl.nose ? 0.15 : -0.15) + pl.bal * 0.25;
      p.handL = v3(0.0, 0.95, 0.65);
      p.handR = v3(0.05, 0.9, -0.65);
    }
  } else if (pl.state === ST_AIR) {
    const t = pl.airT;
    const tuck = smooth01(t / 0.18) * (1 - smooth01((-pl.vel.y - 3.5) / 3) * 0.6);
    p.pelvis.y = 0.86 - tuck * 0.22;
    p.lean = 0.25;
    p.handL = v3(-0.1, 0.95, 0.55);
    p.handR = v3(0.05, 0.9, -0.55);
    p.elbowHintL = v3(0.2, -0.5, 0.6);
    p.elbowHintR = v3(0.2, -0.5, -0.6);
    if (pl.flipIdx >= 0) {
      const fd = FLIPS[pl.flipIdx];
      const u = sat(pl.flipT / pl.flipDur);
      const e = u * u * (3 - 2 * u);
      const turns = 1 + pl.flipExtra;
      const fl = fd.flip * turns * TAU * e, sh = fd.shove * TAU * e, im = fd.imp * turns * TAU * e;
      boardOff = v3(0, 0.12 * Math.sin(u * Math.PI) - 0.05, 0);
      boardT = mulM(mulM(mulM(mulM(mTranslate(v3(0, -0.04, 0)), mRotY(sh)), mRotZ(fl)), mRotX(im)), mTranslate(v3(0, 0.04, 0)));
      const lift = Math.sin(u * Math.PI) * 0.22;
      p.footL.y += lift; p.footR.y += lift * 0.9;
      p.footL.x -= lift * 0.3;
    }
    if (pl.grabIdx >= 0) {
      const g = smooth01(pl.grabBlend);
      p.pelvis.y = 0.86 - 0.3 * g;
      p.lean = 0.25 + 0.25 * g;
      boardOff = v3(0, 0.2 * g, 0);
      let target = v3();
      let front = true;
      switch (pl.grabIdx) {
        case 0: target = v3(-0.1, 0, -0.04); front = false; break;
        case 1: target = v3(0.1, 0, 0.05); break;
        case 2: target = v3(0.1, 0, 0.04); boardT = mulM(mTranslate(v3(0.18 * g, 0.1 * g, 0)), mRotZ(-0.6 * g)); break;
        case 3: target = v3(0, 0, 0.4); break;
        case 4: target = v3(0, 0, -0.4); front = false; break;
        case 5: target = v3(0, 0, 0.38); p.footR = v3(0.25, -0.35 * g, -0.45); break;
        case 6: target = v3(0, 0, -0.38); front = false; p.footR = v3(-0.15, -0.4 * g, -0.5); break;
        case 7: target = v3(0.1, 0, -0.14); front = false; break;
        case 8: target = v3(0.1, 0, 0.08); boardT = mRotX(0.4 * g); break;
      }
      const tw = add(xPoint(mulM(mTranslate(boardOff), boardT), target), v3(0, 0.02, 0));
      if (front) { p.handL = lerp3(p.handL, tw, g); p.elbowHintL = v3(-0.3, 0.2, 0.5); }
      else { p.handR = lerp3(p.handR, tw, g); p.elbowHintR = v3(-0.3, 0.2, -0.5); }
      if (pl.grabIdx !== 5 && pl.grabIdx !== 6) { p.footL.y += boardOff.y; p.footR.y += boardOff.y; }
      else p.footL.y += boardOff.y;
    }
    if (pl.qpAir) p.headYaw = 0.2;
  } else if (pl.state === ST_GRIND) {
    const gd = GRINDS[pl.grindIdx];
    const pv = gd.pitch > 0 ? -0.22 : (gd.pitch < 0 ? 0.22 : 0);
    boardT = mulM(mulM(mulM(mTranslate(v3(0, 0, pv)), mRotX(-gd.pitch)), mRotZ(gd.roll)), mTranslate(v3(0, 0, -pv)));
    p.pelvis = v3(0.02, 0.8, 0);
    p.lean = 0.12;
    p.side = pl.bal * 0.35;
    p.handL = v3(-0.05, 1.0, 0.72);
    p.handR = v3(0.08, 0.95, -0.72);
    p.elbowHintL = v3(0.1, -0.6, 0.3);
    p.elbowHintR = v3(0.1, -0.6, -0.3);
    if (gd.slide) { p.twist = 0.9; p.headYaw = 0.5; }
    if (gd.pitch !== 0) {
      const pd = 0.3 * Math.sin(gd.pitch);
      p.footL.y = -pd; p.footR.y = pd;
    }
  }
  const B = mulM(mulM(R, mTranslate(boardOff)), boardT);
  drawBoard(mb, B);
  drawHuman(mb, R, p, PLAYER_OUTFIT);
}
// ============================================================================
// Living city: pedestrians, pigeons, traffic, signals, collectible letters
// ============================================================================
let bubbles = [];
function speech(p, text) {
  for (const b of bubbles) if (len(sub(b.pos, p)) < 0.5) { b.text = text; b.t = 2.2; return; }
  bubbles.push({ pos: p, text, t: 2.2 });
}

let pathInfo = [];
function preparePaths() {
  pathInfo = [];
  for (const np of npcPaths) {
    const pi = { cum: [0], total: 0 };
    const n = np.pts.length;
    const segs = np.loop ? n : n - 1;
    for (let i = 0; i < segs; i++) {
      pi.total += lenXZ(sub(np.pts[(i + 1) % n], np.pts[i]));
      pi.cum.push(pi.total);
    }
    pathInfo.push(pi);
  }
}
function pathSample(path, s, outP, outDir) {
  const np = npcPaths[path];
  const pi = pathInfo[path];
  const n = np.pts.length;
  const segs = pi.cum.length - 1;
  let i = 0;
  while (i + 1 < segs && pi.cum[i + 1] < s) i++;
  const a = np.pts[i], b = np.pts[(i + 1) % n];
  const L = Math.max(1e-3, pi.cum[i + 1] - pi.cum[i]);
  const t = clampf((s - pi.cum[i]) / L, 0, 1);
  outP.copy(lerp3(a, b, t));
  outDir.copy(norm(v3(b.x - a.x, 0, b.z - a.z)));
}

let npcs = [];
function initNpcs() {
  preparePaths();
  const r = new Rng(9001);
  const skins = [0xf1c7a5, 0xd9a47a, 0xc68a5a, 0x9c6a42, 0x6e4a2e, 0x4a3020];
  const shirts = [0x2f5d9e, 0xd8d4c8, 0x8e2a2a, 0x2e6b3a, 0xe0b030, 0x111111, 0x6a4a8a, 0xe07a30, 0x607080, 0xf0f0f0];
  const pants = [0x1f2a44, 0x222222, 0x5a4a3a, 0x6a6a6a, 0x2a3a5a, 0xb0a080];
  for (let p = 0; p < npcPaths.length; p++) {
    let count = Math.max(1, Math.trunc(pathInfo[p].total / 22));
    count = Math.min(count, 4);
    for (let k = 0; k < count; k++) {
      const n = {
        path: p, dir: 1, s: 0, speed: 1.3, lateral: 0, targetLat: 0, phase: 0,
        pos: v3(), yaw: 0, outfit: newOutfit(), knocked: 0, cheerCool: 0, dodgeCool: 0,
      };
      n.s = r.range(0, pathInfo[p].total);
      n.dir = r.chance(0.5) ? 1 : -1;
      n.speed = r.range(1.0, 1.6);
      n.lateral = n.targetLat = r.range(-0.3, 0.3);
      n.phase = r.range(0, TAU);
      const o = n.outfit;
      o.skin = hexc(skins[r.irange(0, 5)]);
      o.shirt = hexc(shirts[r.irange(0, 9)]);
      o.pants = hexc(pants[r.irange(0, 5)]);
      o.shoes = r.chance(0.5) ? hexc(0x1a1a1a) : hexc(0xdedad0);
      o.hat_ = r.chance(0.35) ? (r.chance(0.5) ? 1 : 3) : 0;
      o.hat = r.chance(0.5) ? hexc(0x1c2a4a) : hexc(0x8a1a1a);
      o.hair = r.chance(0.5) ? hexc(0x1a120c) : hexc(0x6a4a2a);
      o.height = r.range(0.9, 1.07);
      o.bag = r.chance(0.35);
      o.bagCol = r.chance(0.5) ? hexc(0x3a2a1a) : hexc(0x1a1a1a);
      o.longSleeves = r.chance(0.5);
      o.baggy = r.chance(0.3);
      npcs.push(n);
    }
  }
}

const CHEERS = ['NICE!', 'SICK!', 'WHOA!', 'YO! DO THAT AGAIN!', 'THAT WAS DOPE!', 'RESPECT!'];
const ANGRY = ["HEY! I'M WALKIN' HERE!", 'WATCH IT, KID!', 'GET OFF THE SIDEWALK!', 'OW! MY COFFEE!'];

const _npcTmpP = v3(), _npcTmpD = v3();
function updateNpcs(dt, pl, bank) {
  const r = npcRng;
  if (pl.score !== bank.v) {
    if (pl.score - bank.v >= 800) {   // the closest onlooker always reacts to a big line
      let best = null;
      let bd = 18;
      for (const n of npcs)
        if (n.knocked <= 0 && n.cheerCool <= 0 && len(sub(n.pos, pl.pos)) < bd) { bd = len(sub(n.pos, pl.pos)); best = n; }
      if (best) { speech(add(best.pos, v3(0, 2.1, 0)), CHEERS[r.irange(0, 5)]); best.cheerCool = 6; }
    }
    bank.v = pl.score;
  }
  for (const n of npcs) {
    n.cheerCool = Math.max(0, n.cheerCool - dt);
    n.dodgeCool = Math.max(0, n.dodgeCool - dt);
    if (n.knocked > 0) { n.knocked -= dt; continue; }
    const pi = pathInfo[n.path];
    const loop = npcPaths[n.path].loop;
    n.s += n.dir * n.speed * dt;
    if (loop) { if (n.s > pi.total) n.s -= pi.total; if (n.s < 0) n.s += pi.total; }
    else if (n.s > pi.total) { n.s = pi.total; n.dir = -1; }
    else if (n.s < 0) { n.s = 0; n.dir = 1; }
    pathSample(n.path, n.s, _npcTmpP, _npcTmpD);
    const wd = mul(_npcTmpD, n.dir);
    const perp = cross(v3(0, 1, 0), wd);
    n.lateral = damp(n.lateral, n.targetLat, 3, dt);
    const np = add(_npcTmpP, mul(perp, n.lateral));
    np.y = world.ground(np.x, np.z, _npcTmpP.y + 0.4).h;
    n.pos.copy(np);
    const ty = yawOf(wd);
    n.yaw = n.yaw + wrapPi(ty - n.yaw) * Math.min(1, dt * 6);
    n.phase += n.speed * dt * 4.2;
    // dodge a skater that is about to run us over
    if (pl.state !== ST_BAIL && n.dodgeCool <= 0) {
      const rel = sub(n.pos, pl.pos);
      const pv = v3(pl.vel.x, 0, pl.vel.z);
      const sp = len(pv);
      if (sp > 3 && Math.abs(rel.y) < 1.2) {
        const tca = dot(v3(rel.x, 0, rel.z), pv) / (sp * sp);
        if (tca > 0 && tca < 0.7) {
          const closest = add(v3(pl.pos.x, 0, pl.pos.z), mul(pv, tca));
          const miss = sub(v3(n.pos.x, 0, n.pos.z), closest);
          if (len(miss) < 0.9) {
            const sideSign = dot(miss, perp) >= 0 ? 1 : -1;
            n.targetLat = clampf(n.lateral + sideSign * 1.3, -1.8, 1.8);
            n.dodgeCool = 1.2;
            if (r.chance(0.3)) speech(add(n.pos, v3(0, 2.1, 0)), 'WHOA!');
          }
        }
      }
    }
    if (n.dodgeCool <= 0 && Math.abs(n.targetLat) > 0.6) n.targetLat *= 0.5;
    // collisions with the skater
    if (pl.state !== ST_BAIL) {
      const rel = sub(pl.pos, n.pos);
      const dh = Math.sqrt(rel.x * rel.x + rel.z * rel.z);
      if (dh < 0.55 && rel.y > -0.5 && rel.y < 1.5) {
        const relSpeed = len(sub(v3(pl.vel.x, 0, pl.vel.z), mul(wd, n.speed)));

function walkPose(p, phase, speed) {

  const stride = 0.14 + speed * 0.1;
  p.pelvis = v3(0, 0.93 + 0.025 * Math.abs(Math.sin(phase)), 0);
  p.lean = 0.06;
  p.twist = 0;
  p.side = 0;
  p.footL = v3(-sw * stride, Math.max(0, cw) * 0.1, 0.1);
  p.footR = v3(sw * stride, Math.max(0, -cw) * 0.1, -0.1);
  p.footYawL = p.footYawR = 0;
  p.handL = v3(sw * 0.2 + 0.02, 0.5, 0.3);
  p.handR = v3(-sw * 0.2 + 0.02, 0.5, -0.3);
  p.kneeHint = v3(-1, 0, 0);

}

function drawNpcs(mb, cam) {

      p.handL = v3(-0.3, 1.2, 0.5); p.handR = v3(-0.3, 1.2, -0.5);
    } else walkPose(p, n.phase, n.speed);

}

// ---------------------------------------------------------------- traffic
const LANES = [
  { z: -2.1, dir: 1, hasLight: true },
  { z: 2.1, dir: 1, hasLight: true },
  { z: -71.0, dir: -1, hasLight: false },
  { z: -66.4, dir: 1, hasLight: false },
];
let cars = [];
let tlTimer = 0;
function ewPhase() {   // 0 green, 1 yellow, 2 red for east-west traffic
  const t = tlTimer % 32;
  if (t < 13) return 0;
  if (t < 16) return 1;
  return 2;
}
function nsPhase() {
  const t = tlTimer % 32;
  if (t >= 17 && t < 29) return 0;
  if (t >= 29 && t < 31) return 1;
  return 2;
}
function initTraffic() {
  const r = new Rng(555);
  const cols = [hexc(0xf2c318), hexc(0xf2c318), hexc(0xf2c318), hexc(0x1b1b1d), hexc(0x7a1f22), hexc(0x9ca3a8), hexc(0x274a78), hexc(0xd8d4c8)];
  for (let l = 0; l < 4; l++)
    for (let k = 0; k < 3; k++) {
      const c = { lane: l, x: 0, speed: 0, target: 0, type: 0, col: hexc(0), honk: 0, brake: 0 };
      c.x = -120 + k * 80 + r.range(-10, 10);
      c.speed = c.target = r.range(8, 11);
      c.col = cols[r.irange(0, 7)];
      c.type = c.col.r === 0xf2 ? 0 : r.irange(1, 3);
      cars.push(c);
    }
}
function updateTraffic(dt, pl) {
  tlTimer += dt;
  for (const c of cars) {
    const L = LANES[c.lane];
    let want = c.target;
    // car ahead
    for (const o of cars) {
      if (o === c || o.lane !== c.lane) continue;
      const gap = (o.x - c.x) * L.dir;
      if (gap > 0 && gap < 9) want = Math.min(want, Math.max(0, (gap - 5.5) * 1.5));
    }
    // red light (stop line west of the intersection for eastbound traffic)
    if (L.hasLight && ewPhase() !== 0) {
      const stopX = -14.5;
      const gap = (stopX - c.x) * L.dir;
      if (gap > 0 && gap < 22 && (ewPhase() === 2 || gap > 6)) want = Math.min(want, Math.max(0, (gap - 0.5) * 0.9));
    }
    // the skater in the lane ahead
    if (pl.state !== ST_BAIL && pl.pos.y < 1.2 && Math.abs(pl.pos.z - L.z) < 1.9) {
      const gap = (pl.pos.x - c.x) * L.dir;
      if (gap > 0 && gap < 11) {
        want = Math.min(want, Math.max(0, (gap - 3.4) * 1.4));
        if (c.honk <= 0 && Math.abs(pl.pos.x - c.x) < 11) { sfx(SFX_HONK, 0.8, c.type === 0 ? 1.1 : 0.9); c.honk = 2.5; }
      }
    }
    c.honk = Math.max(0, c.honk - dt);
    const acc = want > c.speed ? 3 : 9;
    c.brake = want < c.speed - 0.2 ? 1 : 0;
    c.speed = approach(c.speed, want, acc * dt);
    c.x += c.speed * L.dir * dt;
    if (c.x * L.dir > 140) c.x = -140 * L.dir;
    // hit the skater?
    if (pl.state !== ST_BAIL && pl.pos.y < 1.6) {
      const dx = Math.abs(pl.pos.x - c.x), dz = Math.abs(pl.pos.z - L.z);
      if (dx < 2.6 && dz < 1.2 && c.speed > 2) {
        pl.vel.add(v3(L.dir * c.speed * 0.6, 2, 0));
        pl.bail(c.type === 0 ? 'HIT BY A CAB!' : 'HIT BY A CAR!');
        sfx(SFX_HONK, 1);
      } else if (dx < 2.5 && dz < 1.1) {
        pl.pos.z = L.z + (pl.pos.z > L.z ? 1.25 : -1.25);
      }
    }
  }
}
function drawTraffic(mb, cam) {
  for (const c of cars) {
    const L = LANES[c.lane];
    if (Math.abs(c.x - cam.x) > 150) continue;
    carGeom(mb, frame(c.x, 0, L.z, L.dir > 0 ? Math.PI / 2 : -Math.PI / 2), c.type, c.col, c.brake);

    e.acc += e.rate * dt;
    while (e.acc >= 1) {

          q.size = prng.range(0.05, 0.11); q.grav = 9.8; q.drag = 0.4;
          q.r = 0.85; q.g = 0.93; q.b = 1; q.a = 0.6;
          if (prng.chance(0.15)) { q.size = 0.35; q.grow = 0.8; q.a = 0.12; q.water = false; q.grav = 2; q.drag = 1.5; }

        }
        case EM_STEAM: {
          q.p = add(e.pos, v3(prng.range(-0.3, 0.3), 0, prng.range(-0.3, 0.3)));

// Particle vertex data (pos3, uv2, rgba4 premultiplied; alpha 0 = additive).
// Two fixed-size passes share one interleaved buffer each so nothing is
// reallocated while the game is running.
const MAX_PARTICLES = 7000;
function makePartBuf() {
  return {
    data: new Float32Array(MAX_PARTICLES * 4 * 9),
    idx: new Uint32Array(MAX_PARTICLES * 6),
    n: 0, icount: 0,
  };
}
const partNormal = makePartBuf();
const partAdditive = makePartBuf();
const PART_UV = [0, 0, 1, 0, 1, 1, 0, 1];
function buildParticleMesh(camRight, camUp) {
  partNormal.n = 0; partNormal.icount = 0;
  partAdditive.n = 0; partAdditive.icount = 0;
  for (const q of parts) {
    const buf = q.additive ? partAdditive : partNormal;
    if (buf.icount >= MAX_PARTICLES * 6) continue;
    const fade = sat((q.life / q.maxLife) * 3) * sat((q.maxLife - q.life) * 12 + 0.3);
    const a = q.a * fade;
    const r = q.r * a, g = q.g * a, b = q.b * a, oa = q.additive ? 0 : a;
    const R = mul(camRight, q.size), U = mul(camUp, q.size);
    const px = q.p.x, py = q.p.y, pz = q.p.z;
    const sx = [-1, 1, 1, -1], sy = [-1, -1, 1, 1];
    const d = buf.data;
    let n = buf.n;
    const base = n / 9;   // 4 vertices (9 floats each) per quad
    for (let k = 0; k < 4; k++) {
      d[n] = px + R.x * sx[k] + U.x * sy[k];
      d[n + 1] = py + R.y * sx[k] + U.y * sy[k];
      d[n + 2] = pz + R.z * sx[k] + U.z * sy[k];
      d[n + 3] = PART_UV[k * 2];
      d[n + 4] = PART_UV[k * 2 + 1];
      d[n + 5] = r; d[n + 6] = g; d[n + 7] = b; d[n + 8] = oa;
      n += 9;
    }
    buf.n = n;
    const I = buf.idx;
    I[buf.icount] = base; I[buf.icount + 1] = base + 1; I[buf.icount + 2] = base + 2;
    I[buf.icount + 3] = base; I[buf.icount + 4] = base + 2; I[buf.icount + 5] = base + 3;
    buf.icount += 6;
  }
}

// ============================================================================
const AR = 44100;
const SFX_POP = 0, SFX_LAND = 1, SFX_LAND_HARD = 2, SFX_GRIND = 3, SFX_SLIDE = 4, SFX_BAIL = 5;
const SFX_SPLASH = 6, SFX_COMBO = 7, SFX_BIGCOMBO = 8, SFX_LETTER = 9, SFX_CLACK = 10, SFX_FLIP = 11;
const SFX_HONK = 12, SFX_PIGEONS = 13, SFX_HEY = 14, SFX_MENU = 15, SFX_GAP = 16;
const SFX_COUNT = 17;
const sfxBuf = new Array(SFX_COUNT);

let audioCtx = null;
let musicOn = true, audioMuted = false;
let musicVolume = 0.3;

let aseed = 12345;
function anoise() {
  aseed = (Math.imul(aseed, 1664525) + 1013904223) >>> 0;
  return (((aseed >>> 9) & 0x7fffff) / 4194304) - 1;
}
class OnePole { constructor() { this.y = 0; } lp(x, a) { this.y += a * (x - this.y); return this.y; } }
const lpA = (fc) => 1 - Math.exp((-TAU * fc) / AR);

  bp(x, f, q) {
    const F = 2 * Math.sin((Math.PI * Math.min(f, AR * 0.2)) / AR);
    const h = x - this.l - q * this.b;
    this.b += F * h;
    this.l += F * this.b;
    return this.b;

function projectToScreen(vp, p, out) {
  const e = vp.elements;
  const x = e[0] * p.x + e[4] * p.y + e[8] * p.z + e[12];
  const y = e[1] * p.x + e[5] * p.y + e[9] * p.z + e[13];
  const w = e[3] * p.x + e[7] * p.y + e[11] * p.z + e[15];
  if (w < 0.1) return false;
  out.x = (x / w * 0.5 + 0.5) * hud.W;
  out.y = (1 - (y / w * 0.5 + 0.5)) * hud.H;
  return true;
}

function drawGameHud(pl, time, sessionLeft, session, helpPage, helpAlpha, vp, cam, showFps, fps) {
  const showHelp = helpPage > 0;
  const U = hud.U;
  // score
  hud.text(24 * U, 20 * U, 2 * U, 'SCORE', hexc(0xffd23a), 1);

    const s = Math.ceil(Math.max(0, sessionLeft));

    hud.text(hud.W * 0.5, 38 * U, 5 * U, b, c, 1, 1);
  }
  // S K A T E
  for (let i = 0; i < 5; i++) {
    const bx = hud.W - (5 - i) * 34 * U - 20 * U, by = 20 * U;
    const got = pl.letters[i];
    hud.rect(bx, by, 28 * U, 30 * U, got ? hexc(0xffd23a) : Col(20, 20, 26), got ? 0.95 : 0.55);
    hud.text(bx + 14 * U, by + 8 * U, 2 * U, LETTER_CHARS[i], got ? Col(20, 20, 20) : Col(120, 120, 130), 1, 1, false);
  }
  {   // pointer to the nearest letter still missing (relative to the view direction)
    let bi = -1, bd = 1e9;
    for (let i = 0; i < 5 && i < letterPos.length; i++) {
      if (pl.letters[i]) continue;
      const d = len(sub(letterPos[i], pl.pos));
      if (d < bd) { bd = d; bi = i; }
    }
    if (bi < 0) {
      hud.text(hud.W - 20 * U, 58 * U, 1.5 * U, 'ALL LETTERS FOUND', hexc(0xffd23a), 0.8, 2);
    } else {
      const view = v3(pl.pos.x - cam.x, 0, pl.pos.z - cam.z);
      const to = v3(letterPos[bi].x - pl.pos.x, 0, letterPos[bi].z - pl.pos.z);
      let rel = 0;
      if (lenXZ(view) > 1e-3 && lenXZ(to) > 1e-3) rel = wrapPi(yawOf(to) - yawOf(view));
      const ar = Math.abs(rel);
      const arrow = ar < 0.5 ? '^' : ar > 2.6 ? 'v' : rel > 0 ? '<' : '>';
      const hgt = letterPos[bi].y - pl.pos.y > 2.2 ? ' HIGH' : '';
      hud.text(hud.W - 20 * U, 58 * U, 1.5 * U, `NEXT ${LETTER_CHARS[bi]}  ${Math.round(bd)}M${hgt}  ${arrow}`, Col(200, 200, 200), 0.8, 2);
    }
  }
  // speech bubbles
  for (const b of bubbles) {
    if (len(sub(b.pos, cam)) > 40 || !projectToScreen(vp, b.pos, _proj)) continue;
    const a = Math.min(1, b.t * 3);
    const sc = 1.5 * U;
    const w = hud.textW(b.text, sc) + 14 * U, h = 7 * sc + 12 * U;

  if (pl.combo.active()) {

    hud.rect(x + w * 0.35, y, w * 0.3, 12 * U, hexc(0x3aa84a), 0.5);

    const ny = y + h * 0.5 + pl.bal * h * 0.5;

    hud.rect(x - 5 * U, ny - 3 * U, 22 * U, 6 * U, nc, 1);
    hud.text(x + 6 * U, y - 18 * U, 1.5 * U, 'W / S', Col(230, 230, 230), 0.9, 1);
  }
  // popups
  let py = hud.H * 0.3;
  for (const p of popups) {

const LIGHT = {
  sunDir: norm(v3(-0.62, 0.5, 0.6)),
  sunCol: v3(1.38, 1.14, 0.86),
  skyTop: v3(0.3, 0.48, 0.76), skyHorizon: v3(0.86, 0.79, 0.68),
  groundCol: v3(0.36, 0.32, 0.28), fogCol: v3(0.78, 0.74, 0.68),

const SHADOW_RES = 2048;
let renderer, scene, camera, reflCam, lightCam;

let worldMat, depthMat, skyMat, waterMat, partNormalMat, partAdditiveMat;
let shadowRT, reflRT;
let SHU = null;   // shared uniforms

function mkUniforms(extra) {
  return Object.assign({
    uSunDir: { value: LIGHT.sunDir },
    uSunCol: { value: LIGHT.sunCol },
    uSkyTop: { value: LIGHT.skyTop },
    uSkyHorizon: { value: LIGHT.skyHorizon },
    uGroundCol: { value: LIGHT.groundCol },
    uFogCol: { value: LIGHT.fogCol },
    uCamPos: { value: v3() },

    uFogDensity: { value: LIGHT.fogDensity },
  }, extra || {});
}
function mkMaterial(vs, fs, extra, opts = {}) {

    uniforms: mkUniforms(extra),
    vertexShader: vs,
    fragmentShader: fs,
    side: THREE.DoubleSide,

}

function setCommon(m, camPos, time) {

  const shadowUniforms = { uShadow: { value: shadowRT.depthTexture }, uShadowTexel: { value: 1 / SHADOW_RES } };
  const uClipOff = -1e6;

  depthMat = new THREE.ShaderMaterial({

    uPoolCenter: { value: new THREE.Vector2(28, -34.5) },
    uClipY: { value: uClipOff },

  // particle billboards: one premultiplied-alpha pass, one additive pass
  const partGeo = (pb) => {
    const ib = new THREE.InterleavedBuffer(pb.data, 9);

    g.setAttribute('aCol', new THREE.InterleavedBufferAttribute(ib, 4, 5));
    g.setIndex(new THREE.BufferAttribute(pb.idx, 1).setUsage(THREE.DynamicDrawUsage));

    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,

  partNormalMesh = new THREE.Mesh(partGeo(partNormal), partNormalMat);

  staticMesh = new THREE.Mesh(toGeometry(SM, false), worldMat);

  for (const m of [staticMesh, dynMesh, waterMesh]) m.frustumCulled = false;
  waterMesh.renderOrder = 5;

  scene.add(skyMesh, staticMesh, dynMesh, waterMesh, partNormalMesh, partAdditiveMesh);
  scene.add(new THREE.AmbientLight(0xffffff, 0));   // keep three's light uniforms valid
}

// push a rebuilt MeshBuilder into an existing geometry without reallocating
function syncAttr(g, name, buf, itemSize, normalized) {
  let at = g.attributes[name];
  if (at.array !== buf.a) {           // the buffer grew: three needs a new attribute
    at = new THREE.BufferAttribute(buf.a, itemSize, normalized);
    at.setUsage(THREE.DynamicDrawUsage);
    g.setAttribute(name, at);
  }
  at.updateRange.offset = 0;
  at.updateRange.count = buf.n;
  at.needsUpdate = true;
}
function uploadDynMesh() {
  const g = dynMesh.geometry;
  syncAttr(g, 'position', DM.pos, 3, false);
  syncAttr(g, 'normal', DM.nrm, 3, false);
  syncAttr(g, 'aColor', DM.col, 4, true);
  if (g.index.array !== DM.idx.a) {
    g.setIndex(new THREE.BufferAttribute(DM.idx.a, 1).setUsage(THREE.DynamicDrawUsage));
  }
  const ix = g.index;
  ix.updateRange.offset = 0;
  ix.updateRange.count = DM.idx.n;
  ix.needsUpdate = true;
  g.setDrawRange(0, DM.idx.n);
}
function uploadParticles(mesh, buf) {
  mesh.visible = buf.icount > 0;
  if (!mesh.visible) return;
  const g = mesh.geometry;
  const ib = g.userData.ib;
  ib.updateRange.offset = 0;
  ib.updateRange.count = buf.n;
  ib.needsUpdate = true;
  const ix = g.index;
  ix.updateRange.offset = 0;
  ix.updateRange.count = buf.icount;
  ix.needsUpdate = true;
  g.setDrawRange(0, buf.icount);
}

function mOrthoRH(l, r, b, t, n, f) { return new M4().makeOrthographic(l, r, t, b, n, f); }
const _lmView = new M4();
function lightMatrix(focus, out) {
  const R = 62;
  const eye = add(focus, mul(LIGHT.sunDir, 150));
  // Matrix4.lookAt only builds the rotation; place it at the eye before inverting into a view matrix
  _lmView.copy(new M4().lookAt(eye, focus, v3(0, 1, 0)).setPosition(eye)).invert();
  const ls = xPoint(_lmView, focus);
  const texel = (2 * R) / SHADOW_RES;
  const sx = Math.floor(ls.x / texel) * texel, sy = Math.floor(ls.y / texel) * texel;
  const t = mTranslate(v3(sx - ls.x, sy - ls.y, 0));
  out.copy(mOrthoRH(-R, R, -R, R, 1, 330));
  out.multiply(t);
  out.multiply(_lmView);
  return out;
}
const _lightVP = new M4();

const cam = { pos: v3(0, 6, 40), focus: v3(0, 1, 20), look: v3(), yaw: Math.PI, fov: 64, mode: 0 };
function updateCamera(dt, pl) {
  const hv = v3(pl.vel.x, 0, pl.vel.z);
  const spd = len(hv);
  let targetYaw = cam.yaw;
  if (pl.state !== ST_BAIL && spd > 1.2) targetYaw = yawOf(hv);
  const rate = pl.state === ST_AIR ? (pl.qpAir ? 0.4 : 1.6) : (pl.state === ST_BAIL ? 0.3 : 3.6);
  cam.yaw += wrapPi(targetYaw - cam.yaw) * (1 - Math.exp(-rate * dt));
  let dist = 4.4 + Math.min(spd, 14) * 0.13, height = 1.75;
  let fov = 62 + Math.min(spd, 14) * 0.9;
  if (pl.state === ST_AIR && pl.qpAir) { dist += 2.2; height -= 0.5; }
  if (cam.mode === 1) { dist += 4; height += 2.6; }
  if (cam.mode === 2) { dist = 2.4; height = 0.55; fov = 96; }
  const focus = add(pl.state === ST_BAIL ? pl.bodyPos : pl.pos, v3(0, 1.05, 0));
  const f = cam.focus;
  f.x = damp(f.x, focus.x, 16, dt);
  f.z = damp(f.z, focus.z, 16, dt);
  f.y = damp(f.y, focus.y, pl.state === ST_AIR ? 5 : 10, dt);
  if (len(sub(f, focus)) > 8) f.copy(focus);
  let desired = add(add(f, mul(fwdYaw(cam.yaw), -dist)), v3(0, height - 0.65, 0));
  const t = world.rayFree(f, desired);
  if (t < 1) desired = add(f, mul(sub(desired, f), Math.max(0.1, t - 0.08)));
  const gy = world.ground(desired.x, desired.z, desired.y + 0.4).h;
  desired.y = Math.max(desired.y, gy + 0.3);
  if (len(sub(cam.pos, desired)) > 12) cam.pos.copy(desired);
  cam.pos.copy(damp3(cam.pos, desired, 10, dt));
  cam.look = add(add(f, mul(fwdYaw(cam.yaw), 1.6)), v3(0, -0.15, 0));
  cam.fov = damp(cam.fov, fov, 3, dt);
}

// ============================================================================
// Main
// ============================================================================
const GM_TITLE = 0, GM_PLAY = 1, GM_PAUSE = 2, GM_RESULTS = 3;
const keys = Object.create(null);
const latched = new Input();

function setKey(e, down) {
  keys[e.code] = down;
}
function keyDown(e) {
  if (e.repeat) return;
  setKey(e, true);
  resumeAudio();
  if (e.code === 'F11') {
    e.preventDefault();
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
    return;
  }
  if (e.code === 'Tab') e.preventDefault();
  if (mode === GM_TITLE) {
    if (e.code === 'Enter' || e.code === 'NumpadEnter' || e.code === 'Space') { mode = GM_PLAY; session = false; sfx(SFX_MENU); helpTimer = 14; helpPage = 1; }
    else if (e.code === 'KeyT') { startSession(); sfx(SFX_MENU); }
  } else if (mode === GM_PLAY) {
    switch (e.code) {
      case 'Escape': case 'KeyP': mode = GM_PAUSE; sfx(SFX_MENU); break;
      case 'KeyH': case 'F1': helpPage = (helpPage + 1) % 3; helpTimer = 1e9; break;
      case 'KeyM': musicOn = !musicOn; popup(musicOn ? 'MUSIC ON' : 'MUSIC OFF', Col(220, 220, 220), 0.8, 1.2); break;
      case 'KeyV': cam.mode = (cam.mode + 1) % 3; popup(cam.mode === 0 ? 'CHASE CAM' : cam.mode === 1 ? 'HIGH CAM' : 'FILMER FISHEYE', Col(220, 220, 220), 0.8, 1.2); break;
      case 'KeyR': P.reset(SPAWN_POS, SPAWN_YAW); cam.yaw = SPAWN_YAW; break;
      case 'KeyT': startSession(); break;
      case 'F3': showFps = !showFps; break;
      case 'Space': latched.olliePress = true; break;
      case 'KeyJ': case 'KeyZ': latched.flipPress = true; break;
      case 'KeyK': case 'KeyX': latched.grabPress = true; break;
      case 'KeyL': case 'KeyC': latched.grindPress = true; break;
      case 'KeyI': case 'ShiftLeft': case 'ShiftRight': latched.manualPress = true; break;
      default: break;
    }
  } else if (mode === GM_PAUSE) {
    if (e.code === 'Escape' || e.code === 'KeyP' || e.code === 'Enter') mode = GM_PLAY;
    else if (e.code === 'KeyQ') { mode = GM_TITLE; session = false; }
    else if (e.code === 'KeyR') { P.reset(SPAWN_POS, SPAWN_YAW); cam.yaw = SPAWN_YAW; mode = GM_PLAY; }
  } else if (mode === GM_RESULTS) {
    if (e.code === 'Enter' || e.code === 'NumpadEnter') startSession();
    else if (e.code === 'Escape') { mode = GM_PLAY; session = false; }
  }
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Tab'].indexOf(e.code) >= 0) e.preventDefault();
}

let mode = GM_TITLE, running = true, showFps = false, session = false, newBest = false;
let helpPage = 1, helpTimer = 14, sessionLeft = 0, time = 0, fps = 60, ambientT = 8;
let sessionBest = 0;
const lastScoreSeen = { v: 0 };
let acc = 0, prevTime = 0, frameNo = 0;
const ctrl = new Input();
const lastIn = new Input();

function startSession() {
  session = true;
  sessionLeft = 120;
  P.score = 0;
  P.reset(SPAWN_POS, SPAWN_YAW);
  for (let i = 0; i < 5; i++) P.letters[i] = false;
  P.lettersGot = 0;
  popups.length = 0;
  popup('2 MINUTE SESSION - GO!', hexc(0xffd23a), 1.3, 2.5);
  mode = GM_PLAY;
  newBest = false;
}

function onResize() {
  const w = window.innerWidth, h = window.innerHeight;
  if (renderer) {
    renderer.setSize(w, h, false);
    camera.aspect = w / Math.max(1, h);
    camera.updateProjectionMatrix();
  }
  hud.begin(w, h, Math.min(window.devicePixelRatio || 1, 2));
}

function renderScene(camPos, timeVal, vp, clipY) {
  worldMat.uniforms.uLightVP.value.copy(_lightVP);
  worldMat.uniforms.uClipY.value = clipY;
  setCommon(worldMat, camPos, timeVal);
  skyMat.uniforms.uInvVP.value.copy(vp).invert();
  setCommon(skyMat, camPos, timeVal);
  setCommon(waterMat, camPos, timeVal);
  waterMat.uniforms.uLightVP.value.copy(_lightVP);
  waterMat.uniforms.uClipY.value = clipY;
  setCommon(partNormalMat, camPos, timeVal);
  setCommon(partAdditiveMat, camPos, timeVal);
}

function frameLoop(now) {
  requestAnimationFrame(frameLoop);
  if (!running) return;
  const t = now * 0.001;
  let frameDt = prevTime ? t - prevTime : 1 / 60;
  prevTime = t;
  frameDt = Math.min(frameDt, 0.1);
  fps = damp(fps, 1 / Math.max(frameDt, 1e-4), 2, frameDt);
  time += frameDt;

  // ---------------------------------------------------------------- input
  const held = (...codes) => codes.some((c) => keys[c]);
  ctrl.up = held('KeyW', 'ArrowUp');
  ctrl.down = held('KeyS', 'ArrowDown');
  ctrl.left = held('KeyA', 'ArrowLeft');
  ctrl.right = held('KeyD', 'ArrowRight');
  ctrl.ollie = held('Space');
  ctrl.flip = held('KeyJ', 'KeyZ');
  ctrl.grab = held('KeyK', 'KeyX');
  ctrl.grind = held('KeyL', 'KeyC');
  ctrl.manual = held('KeyI', 'ShiftLeft', 'ShiftRight');
  ctrl.olliePress = ctrl.ollie && !lastIn.ollie;
  ctrl.flipPress = ctrl.flip && !lastIn.flip;
  ctrl.grabPress = ctrl.grab && !lastIn.grab;
  ctrl.grindPress = ctrl.grind && !lastIn.grind;
  ctrl.manualPress = ctrl.manual && !lastIn.manual;
  ctrl.olliePress = ctrl.olliePress || latched.olliePress;
  ctrl.flipPress = ctrl.flipPress || latched.flipPress;
  ctrl.grabPress = ctrl.grabPress || latched.grabPress;
  ctrl.grindPress = ctrl.grindPress || latched.grindPress;
  ctrl.manualPress = ctrl.manualPress || latched.manualPress;
  Object.assign(lastIn, ctrl);
  latched.olliePress = latched.flipPress = latched.grabPress = latched.grindPress = latched.manualPress = false;

  // ---------------------------------------------------------------- simulation
  if (mode === GM_PLAY) {
    const step = 1 / 120;
    acc += frameDt;
    let n = 0;
    while (acc >= step && n < 12) {
      P.prevPos.copy(P.pos);
      P.update(ctrl, step);
      ctrl.olliePress = ctrl.flipPress = ctrl.grabPress = ctrl.grindPress = ctrl.manualPress = false;
      acc -= step;
      n++;
    }
    if (n === 12) acc = 0;
    updateNpcs(frameDt, P, lastScoreSeen);
    updatePigeons(frameDt, P);
    updateTraffic(frameDt, P);
    if (session) {
      sessionLeft -= frameDt;
      if (sessionLeft <= 0 && !P.combo.active() && P.state !== ST_AIR && P.state !== ST_GRIND) {
        mode = GM_RESULTS;
        newBest = P.score > sessionBest;
        sessionBest = Math.max(sessionBest, P.score);
        sfx(SFX_BIGCOMBO);
      }
    }
    helpTimer -= frameDt;
    if (helpTimer <= 0 && helpTimer > -1) helpPage = 0;
    ambientT -= frameDt;
    if (ambientT <= 0) { sfx(SFX_HONK, 0.07, prng.range(0.75, 1.0)); ambientT = prng.range(9, 22); }
  } else if (mode === GM_TITLE) {
    updateTraffic(frameDt, P);
    updateNpcs(frameDt, P, lastScoreSeen);
  }
  for (const p of popups) p.t += frameDt;
  for (let i = popups.length - 1; i >= 0; i--) if (popups[i].t > popups[i].life) popups.splice(i, 1);
  for (const b of bubbles) b.t -= frameDt;
  for (let i = bubbles.length - 1; i >= 0; i--) if (bubbles[i].t <= 0) bubbles.splice(i, 1);

  // ---------------------------------------------------------------- camera
  if (mode === GM_TITLE) {
    cam.pos = v3(4 * Math.sin(time * 0.07), 17 + 2 * Math.sin(time * 0.11), 26 + 6 * Math.cos(time * 0.05));
    cam.look = v3(12 + 6 * Math.sin(time * 0.04), 2, -30);
    cam.fov = 60;
  } else {
    // follow the same interpolated position the skater is drawn at, otherwise
    // the camera steps with the 120 Hz physics while the body glides => jitter
    const simPos = P.pos.clone();
    const alpha = mode === GM_PLAY ? acc / (1 / 120) : 1;
    if (P.state !== ST_BAIL && len(sub(P.pos, P.prevPos)) < 1) P.pos = lerp3(P.prevPos, P.pos, sat(alpha));
    updateCamera(frameDt, P);
    P.pos = simPos;
  }
  {   // water ambience from nearby fountains/hydrants
    let w = 0;
    for (const em of emitters) if (em.kind === EM_FOUNTAIN || em.kind === EM_HYDRANT) w = Math.max(w, 1 - len(sub(em.pos, P.pos)) / 22);
    aud.water = mode === GM_PLAY ? Math.max(0, w) * 0.8 : 0;
    if (mode !== GM_PLAY) { aud.roll = 0; aud.grind = 0; aud.wind = 0; }
  }
  updateParticles(mode === GM_PAUSE ? 0 : frameDt, cam.pos);

  // ---------------------------------------------------------------- render
  camera.fov = cam.fov;
  camera.updateProjectionMatrix();
  camera.position.copy(cam.pos);
  camera.up.set(0, 1, 0);
  camera.lookAt(cam.look);
  camera.updateMatrixWorld(true);
  const camFwd = norm(sub(cam.look, cam.pos));
  const vp = new M4().multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse);

  // dynamic geometry
  DM.clear();
  {
    const simPos = P.pos.clone();
    const alpha = mode === GM_PLAY ? acc / (1 / 120) : 1;
    if (P.state !== ST_BAIL && len(sub(P.pos, P.prevPos)) < 1) P.pos = lerp3(P.prevPos, P.pos, sat(alpha));
    drawSkater(DM, P, ctrl);
    P.pos = simPos;
  }
  drawNpcs(DM, cam.pos);
  drawPigeons(DM, cam.pos);
  drawTraffic(DM, cam.pos);
  drawSignals(DM);
  drawLetters(DM, P, time);
  uploadDynMesh();

  // particles
  const camRight = norm(cross(camFwd, v3(0, 1, 0)));
  const camUp = cross(camRight, camFwd);
  buildParticleMesh(camRight, camUp);
  uploadParticles(partNormalMesh, partNormal);
  uploadParticles(partAdditiveMesh, partAdditive);

  // shadow map
  const focus = mode === GM_TITLE ? v3(14, 0, -26) : P.pos;
  lightMatrix(add(focus, mul(camFwd, 25)), _lightVP);
  lightCam.projectionMatrix.copy(_lightVP);
  lightCam.projectionMatrixInverse.copy(_lightVP).invert();
  depthMat.uniforms.uLightVP.value.copy(_lightVP);
  worldMat.uniforms.uLightVP.value.copy(_lightVP);
  const skyVis = skyMesh.visible, waterVis = waterMesh.visible;
  const pN = partNormalMesh.visible, pA = partAdditiveMesh.visible;
  staticMesh.material = dynMesh.material = depthMat;
  skyMesh.visible = waterMesh.visible = partNormalMesh.visible = partAdditiveMesh.visible = false;
  renderer.setRenderTarget(shadowRT);
  renderer.clear(true, true, false);
  renderer.render(scene, lightCam);
  staticMesh.material = dynMesh.material = worldMat;
  skyMesh.visible = skyVis; waterMesh.visible = waterVis;
  partNormalMesh.visible = pN; partAdditiveMesh.visible = pA;

  // planar reflection of the city in the river
  const wantRefl = cam.pos.z < 25 || camFwd.z < -0.3;
  if (wantRefl) {
    const rw = Math.max(64, Math.floor(window.innerWidth / 2));
    const rh = Math.max(64, Math.floor(window.innerHeight / 2));
    if (!reflRT) {
      reflRT = new THREE.WebGLRenderTarget(rw, rh, { minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, format: THREE.RGBAFormat, depthBuffer: true, stencilBuffer: false });
      waterMat.uniforms.uReflTex.value = reflRT.texture;
    } else if (reflRT.width !== rw || reflRT.height !== rh) reflRT.setSize(rw, rh);
    // mirror the camera about the water plane
    const mirror = new M4().makeTranslation(0, 2 * WATER_LEVEL, 0).multiply(new M4().makeScale(1, -1, 1));
    reflCam.matrixWorld.multiplyMatrices(mirror, camera.matrixWorld);
    reflCam.matrixWorldInverse.copy(reflCam.matrixWorld).invert();
    reflCam.projectionMatrix.copy(camera.projectionMatrix);
    reflCam.projectionMatrixInverse.copy(camera.projectionMatrixInverse);
    reflCam.fov = camera.fov; reflCam.aspect = camera.aspect;
    const rc = v3(cam.pos.x, 2 * WATER_LEVEL - cam.pos.y, cam.pos.z);
    const rvp = new M4().multiplyMatrices(reflCam.projectionMatrix, reflCam.matrixWorldInverse);
    const pN2 = partNormalMesh.visible, pA2 = partAdditiveMesh.visible;
    partNormalMesh.visible = partAdditiveMesh.visible = false;
    renderer.setRenderTarget(reflRT);
    renderer.setClearColor(0x000000, 1);
    renderer.clear(true, true, false);
    renderScene(rc, time, rvp, WATER_LEVEL + 0.05);
    renderer.render(scene, reflCam);
    partNormalMesh.visible = pN2; partAdditiveMesh.visible = pA2;
  }
  waterMat.uniforms.uHasRefl.value = wantRefl ? 1 : 0;
  waterMat.uniforms.uViewport.value.set(renderer.getContext().drawingBufferWidth, renderer.getContext().drawingBufferHeight);
  waterMat.uniforms.uReflTex.value = reflRT ? reflRT.texture : null;

  // main pass
  renderer.setRenderTarget(null);
  renderer.setClearColor(0x000000, 1);
  renderer.clear(true, true, false);
  renderScene(cam.pos, time, vp, -1e6);
  renderer.render(scene, camera);
  frameNo++;
}

function boot() {
  try {
    initAudio(false);
  } catch (e) { console.warn('Audio init failed:', e); }
  buildLevel();          // geometry has to exist before the meshes are created
  initRenderer();
  initNpcs();
  initPigeons();
  initTraffic();
  P.reset(SPAWN_POS, SPAWN_YAW);
  cam.yaw = SPAWN_YAW;
  cam.focus = add(P.pos, v3(0, 1.05, 0));
  cam.pos = add(sub(cam.focus, mul(fwdYaw(cam.yaw), 5)), v3(0, 1.2, 0));
  onResize();
  window.addEventListener('resize', onResize);
  window.addEventListener('keydown', keyDown);
  window.addEventListener('keyup', (e) => setKey(e, false));
  window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
  cv.addEventListener('pointerdown', () => resumeAudio());
  console.log(`Concrete Jungle: ${SM.idx.n / 3 | 0} static triangles, ${world.solids.length} solids, ${world.rails.length} rails, ${npcs.length} pedestrians, ${pigeons.length} pigeons`);
  requestAnimationFrame(frameLoop);
  // HUD has to be redrawn every frame on top of the WebGL canvas
  const drawHud = () => {
    if (running) {
      hud.begin(window.innerWidth, window.innerHeight, Math.min(window.devicePixelRatio || 1, 2));
      hud.vignette(0.55);
      if (mode === GM_TITLE) drawTitle(time);
      else {
        const vp = new M4().multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse);
        drawGameHud(P, time, sessionLeft, session, mode === GM_PLAY ? helpPage : 0, 1, vp, cam.pos, showFps, fps);
        if (mode === GM_PAUSE) drawPause();
        if (mode === GM_RESULTS) drawResults(P.score, sessionBest, newBest, time);
      }
    }
    requestAnimationFrame(drawHud);
  };
  requestAnimationFrame(drawHud);
}
boot();
</script>
